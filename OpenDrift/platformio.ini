[env:waveshare_amoled_164_v2_crsf_oops_gpio8]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
