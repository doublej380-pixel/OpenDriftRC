; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_amoled_164

; Private headless port for the Waveshare ESP32-S3-Matrix. These targets are
; intentionally excluded from releases and the public web flasher for now.
; PWM pins: steering in GPIO1, throttle in GPIO2, steering out GPIO3, and
; throttle out / gain input GPIO4. The onboard 8x8 WS2812 matrix is GPIO14.
[env:waveshare_s3_matrix_pwm]
platform = platformio/espressif32@7.0.1
board = waveshare_s3_matrix
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_matrix.csv
build_flags =
	-DOPENDRIFT_BOARD_MATRIX
	-DOPENDRIFT_HEADLESS
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	adafruit/Adafruit NeoPixel@^1.12.3
	madhephaestus/ESP32Servo@^3.2.1
lib_ignore =
	Display
	Touch
	UI

; Private full-duplex CRSF Matrix port. GPIO1 drives steering, GPIO2 drives
; the ESC, GPIO3 receives CRSF, and GPIO4 transmits CRSF telemetry.
[env:waveshare_s3_matrix_crsf]
platform = platformio/espressif32@7.0.1
board = waveshare_s3_matrix
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions_matrix.csv
build_flags =
	-DOPENDRIFT_BOARD_MATRIX
	-DOPENDRIFT_HEADLESS
	-DOPENDRIFT_INPUT_CRSF
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	adafruit/Adafruit NeoPixel@^1.12.3
	madhephaestus/ESP32Servo@^3.2.1
lib_ignore =
	Display
	Touch
	UI

; Primary/final OpenDrift hardware target.
[env:waveshare_amoled_164]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
build_unflags = -DARDUINO_USB_MODE=1
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions_ota.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DOPENDRIFT_USB_MAINTENANCE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1

; Full-duplex CRSF target for the final AMOLED hardware. GPIO 17 receives
; CRSF, GPIO 18 transmits telemetry, GPIO 15 drives the steering servo, and
; GPIO 16 drives the ESC.
[env:waveshare_amoled_164_crsf]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
build_unflags = -DARDUINO_USB_MODE=1
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions_ota.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DOPENDRIFT_USB_MAINTENANCE
	-DOPENDRIFT_INPUT_CRSF
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1

