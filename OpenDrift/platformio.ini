[env:waveshare_amoled_164_v2_crsf_oops_gpio8]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
build_unflags = -DARDUINO_USB_MODE=1
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions_ota.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DOPENDRIFT_AMOLED_V2
	-DOPENDRIFT_INPUT_CRSF
	-DOPENDRIFT_CRSF_V2_THROTTLE_GPIO8
	-DOPENDRIFT_USB_MAINTENANCE
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=0
