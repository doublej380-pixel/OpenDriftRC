; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_amoled_164

; Primary/final OpenDrift hardware target.
[env:waveshare_amoled_164]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1

; Full-duplex CRSF target for the final AMOLED hardware. GPIO 17 receives
; CRSF, GPIO 18 transmits telemetry, GPIO 15 drives the steering servo, and
; GPIO 16 drives the ESC.
[env:waveshare_amoled_164_crsf]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DOPENDRIFT_INPUT_CRSF
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1

; Deprecated experimental target. Kept for community tinkering.
[env:waveshare_128]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
lib_deps = 
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0

; Isolated CRSF development target for the deprecated round display board.
; This environment uses its own settings namespace and does not alter the
; proven PWM input/output path compiled by waveshare_128. Receiver TX feeds
; GPIO 17; GPIO 18 returns parameter telemetry to the receiver, GPIO 15 drives
; the steering servo, and GPIO 16 drives the ESC.
[env:waveshare_128_crsf]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_INPUT_CRSF
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0
