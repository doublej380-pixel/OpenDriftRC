; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_amoled_164

; Primary/final OpenDrift hardware target.
[env:waveshare_amoled_164]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX
	madhephaestus/ESP32Servo@^3.2.1

; Isolated CRSF development target for the final AMOLED hardware.
; GPIO 15 throttle output remains disabled while sustained CRSF input is
; validated on the breadboard.
[env:waveshare_amoled_164_crsf]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DOPENDRIFT_INPUT_CRSF
	-DOPENDRIFT_EXPERIMENTAL_CRSF
	-DOPENDRIFT_CRSF_INPUT_ONLY
	-DOPENDRIFT_CRSF_RX_ONLY
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX
	madhephaestus/ESP32Servo@^3.2.1

; Minimal hardware recovery image. It deliberately initializes no display,
; sensors, radio, WiFi, storage, or PWM peripherals.
[env:waveshare_amoled_164_serial_test]
platform = platformio/espressif32@7.0.1
board = waveshare_amoled_164
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.psram_type = opi
board_build.partitions = partitions.csv
build_src_filter =
	-<*>
	+<diagnostics/amoled_serial_test.cpp>
build_flags =
	-DOPENDRIFT_AMOLED_SERIAL_TEST
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1

; Deprecated experimental target. Kept for community tinkering.
[env:waveshare_128]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
lib_deps = 
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0

; Isolated CRSF development target for the deprecated round display board.
; This environment uses its own settings namespace and does not alter the
; proven PWM input/output path compiled by waveshare_128. Receiver TX feeds
; GPIO 17; GPIO 18 returns parameter telemetry to the receiver, and GPIO 15
; drives the ESC.
[env:waveshare_128_crsf]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_INPUT_CRSF
	-DOPENDRIFT_EXPERIMENTAL_CRSF
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0

; Minimal receiver diagnostic for tracking down CRSF boot lockups on the
; round board. It initializes only the display and the RX-only UART; it does
; not start the servo, IMU, touch, WiFi, storage, or control task.
[env:waveshare_128_crsf_test]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_src_filter =
	-<*>
	+<diagnostics/round_crsf_test.cpp>
build_flags =
	-DOPENDRIFT_CRSF_DIAGNOSTIC
lib_deps =
	lovyan03/LovyanGFX

; Fallback target for recovering an AMOLED board without its custom definition.
[env:waveshare_amoled_164_rescue]
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = default_8MB.csv
build_flags =
	-DOPENDRIFT_BOARD_AMOLED_164
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DARDUINO_USB_MODE=1
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX
	madhephaestus/ESP32Servo@^3.2.1
