	madhephaestus/ESP32Servo@^3.2.1

; Deprecated compatibility target, retained as a tested fallback. v1.0.7c
; includes a synchronized round build for existing hardware, but AMOLED remains
; the primary target for future development.
[env:waveshare_128]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
lib_deps = 
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0

; CRSF compatibility target for the deprecated round display board. This environment
; uses its own settings namespace and does not alter the PWM path compiled by
; waveshare_128. v1.0.7c includes it for existing round hardware. Receiver TX feeds
; GPIO 17; GPIO 18 returns parameter telemetry to the receiver, GPIO 15 drives
; the steering servo, and GPIO 16 drives the ESC.
[env:waveshare_128_crsf]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
build_flags =
	-DOPENDRIFT_INPUT_CRSF
lib_deps =
	lewisxhe/SensorLib@^0.4.1
	lovyan03/LovyanGFX@1.2.26
	madhephaestus/ESP32Servo@^3.2.1
	fbiego/CST816S@^1.3.0

; Private recovery target seeded once with the tune captured in blackbox 51.
; It uses a dedicated preferences namespace, runs the controller at 333 Hz,
; and intentionally leaves all steering/servo calibration at fresh defaults.
[env:waveshare_128_crsf_log51_tune]
platform = platformio/espressif32@7.0.1
board = lolin_s3_mini
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.partitions = partitions.csv
