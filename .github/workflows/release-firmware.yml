name: Build and release firmware

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out OpenDrift
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install platformio esptool

      - name: Build AMOLED firmware
        run: pio run -d OpenDrift -e waveshare_amoled_164

      - name: Build round firmware
        run: pio run -d OpenDrift -e waveshare_128

      - name: Prepare installer and release assets
        shell: bash
        run: |
          mkdir -p _site
          cp -a installer/. _site/
          rm -rf _site/firmware
          python installer/package_release.py \
            --project-dir OpenDrift \
            --site-dir _site \
            --release-dir release-assets \
            --version "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload installer
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy installer
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --verify-tag
          --generate-notes
          --title "OpenDrift ${GITHUB_REF_NAME}"
